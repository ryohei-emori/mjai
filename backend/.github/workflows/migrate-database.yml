# ============================================================================
# ⚠️  WARNING: MANUAL DISPATCH ONLY - DO NOT AUTO-TRIGGER
# ============================================================================
# This workflow performs LIVE DATA MIGRATION to Supabase Postgres.
# Running this against the wrong target can cause DATA LOSS.
#
# Before running:
# 1. Verify TARGET_DATABASE_URL points to the correct Supabase project
# 2. Confirm you have a recent backup
# 3. Test in staging first if available
#
# This is a one-time migration tool, not a routine deployment step.
# ============================================================================

name: Database Migration (Manual Only)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '⚠️ Target environment (verify TARGET_DATABASE_URL secret!)'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migration
        env:
          # The migration script reads DATABASE_URL from environment (conf/.env or env var)
          DATABASE_URL: ${{ secrets.TARGET_DATABASE_URL }}
        run: |
          cd backend
          echo "Starting migration to target DATABASE_URL..."
          python db/migrate_to_supabase.py

      - name: Verify migration
        env:
          TARGET_DATABASE_URL: ${{ secrets.TARGET_DATABASE_URL }}
        run: |
          cd backend
          echo "Running tests against target database..."
          TARGET_DATABASE_URL=$TARGET_DATABASE_URL pytest app/test_main.py -v