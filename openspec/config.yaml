schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  MJAI is a Japanese text correction AI application.
  Tech stack: FastAPI (Python) backend, Next.js/React/TypeScript frontend, SQLite persistence.
  Deployed via Docker Compose (conf/) with ngrok tunnels for external access.
  Backend: backend/app (main.py, db_helper.py, llm/ provider abstraction for Gemini/OpenAI, models/).
  Frontend: frontend/src (app/ Next.js app dir, components/ui shadcn/ui, hooks/).
  Data model: Session -> CorrectionHistory -> AIProposal hierarchy.

